[project]
name = "sidda-jax"
version = "0.1.0"
description = "JAX / Flax NNX / OTT-JAX reimplementation of SIDDA (SInkhorn Dynamic Domain Adaptation)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "flax",
    "optax",
    "ott-jax",
    "orbax-checkpoint",
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "tqdm",
    "pyyaml",
    "matplotlib",
    "seaborn",
]
